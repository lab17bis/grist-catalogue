<!doctype html>
<html lang="fr" data-fr-scheme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue</title>
  <link rel="stylesheet" href="vendor/dsfr/dsfr.min.css">
  <link rel="stylesheet" href="css/page.css?v=2">
  <link rel="stylesheet" href="css/catalogue.css?v=1">
</head>
<body>
  <div class="fr-skiplinks">
    <nav class="fr-container" role="navigation" aria-label="Accès rapide">
      <ul class="fr-skiplinks__list">
        <li><a class="fr-link" href="#contenu">Contenu</a></li>
        <li><a class="fr-link" href="#pied">Pied de page</a></li>
      </ul>
    </nav>
  </div>
  <div id="entete"></div>
  <main class="fr-container fr-py-4w" id="contenu" tabindex="-1">
    <p class="fr-text--sm">Chargement…</p>
  </main>
  <div id="pied"></div>

  <script>
    // API Grist chargée seulement dans un widget (cadre Grist).
    if (window.self !== window.top && !/[?&](grist|demo)=?/.test(location.search)) {
      document.write('<script src="https://docs.getgrist.com/grist-plugin-api.js"><\/script>');
    }
  </script>
  <script src="js/page-dsfr.js?v=2"></script>
  <script src="js/catalogue.js?v=1"></script>
  <script>
  (function () {
    "use strict";
    var app = document.getElementById("contenu");
    var params = new URLSearchParams(location.search);
    var dansGrist = window.self !== window.top && params.get("grist") === null && params.get("demo") === null;

    function erreur(titre, texte) {
      app.innerHTML = "";
      var d = document.createElement("div");
      d.className = "fr-alert fr-alert--error";
      var h = document.createElement("h1"); h.className = "fr-alert__title"; h.textContent = titre;
      var p = document.createElement("p"); p.textContent = texte;
      d.appendChild(h); d.appendChild(p); app.appendChild(d);
      document.title = titre;
    }

    function boutonConfigurer(libelle, discret) {
      var p = document.createElement("p");
      p.className = "fr-mt-2w fr-mx-2w";
      p.innerHTML = "<a class=\"fr-btn" + (discret ? " fr-btn--sm fr-btn--tertiary" : "") + "\" href=\"editeur.html" + location.search.replace(/&/g, "&amp;").replace(/"/g, "&quot;") + "\">" + libelle + "</a>";
      app.appendChild(p);
    }

    function afficher(source, donnees) {
      var config = donnees.config;
      if (!config) {
        erreur("Catalogue non configuré", "Ce tableau ne contient pas encore de réglages de catalogue. Configurez-le avec l'éditeur (editeur.html) dans Grist.");
        if (source.mode === "widget" || source.mode === "demo") { boutonConfigurer("Configurer le catalogue", false); }
        return;
      }
      if (params.get("integre") !== "1") {
        window.PageDSFR.appliquer(config.page, {
          entete: document.getElementById("entete"),
          pied: document.getElementById("pied"),
          accueil: location.pathname + location.search
        });
      }
      var instance = window.Catalogue.monter(app, {
        config: config, lignes: donnees.lignes, types: donnees.types, source: source,
        demo: source.mode === "demo",
        lienPublic: source.mode === "widget" ? (config.publication && config.publication.lienPublic) : null
      });
      return instance;
    }

    var source;
    if (params.get("demo") !== null) {
      source = window.Catalogue.sourceDemo("exemples/demo.json");
    } else if (params.get("grist")) {
      source = window.Catalogue.sourceRest(params.get("grist"), params.get("table"));
      if (!source) {
        erreur("Lien incomplet", "Le lien doit indiquer le document Grist (?grist=…) et la table (&table=…).");
        return;
      }
    } else if (dansGrist && window.grist) {
      source = window.Catalogue.sourceWidget();
    }

    if (!source) {
      erreur("Aucun catalogue indiqué", "Ajoutez à l'adresse le lien d'un document Grist public (?grist=…&table=…), ou ?demo pour une démonstration.");
      return;
    }

    if (source.mode === "widget") {
      grist.ready({ requiredAccess: "full" });
      var instance = null, enCours = false;
      var recharger = function () {
        if (enCours) { return; }
        enCours = true;
        source.charger().then(function (d) {
          if (instance) { instance.detruire(); }
          instance = afficher(source, d);
          if (d.config) { boutonConfigurer("Configurer", true); }
        }).catch(function (e) {
          erreur("Lecture impossible", "Accordez l'accès complet au document à ce widget. (" + e.message + ")");
        }).then(function () { enCours = false; });
      };
      grist.onRecords(recharger);
      setTimeout(recharger, 600);
      return;
    }

    source.charger().then(function (d) { afficher(source, d); }).catch(function (e) {
      erreur("Catalogue momentanément indisponible", "Les données n'ont pas pu être chargées. Vérifiez que le document Grist est partagé en lecture publique. (" + e.message + ")");
    });
  })();
  </script>
</body>
</html>
